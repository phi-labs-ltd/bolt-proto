name: Publish bolt-proto-extensions image
on:
  push:
    branches: [main]
    paths:
      - plugins/bolt-proto-extensions/**
permissions:
  contents: read
  packages: write
jobs:
  publish:
    name: Build and push ghcr.io/phi-labs-ltd/bolt-proto-extensions
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the image tag and refuse to overwrite it
        id: tag
        shell: bash
        run: |
          image="ghcr.io/phi-labs-ltd/bolt-proto-extensions:v$(cat plugins/bolt-proto-extensions/VERSION)"
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "::error::$image already exists; bump plugins/bolt-proto-extensions/VERSION and the tag in scripts/bolt-proto-extensions"
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: plugins/bolt-proto-extensions
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tag.outputs.image }}
