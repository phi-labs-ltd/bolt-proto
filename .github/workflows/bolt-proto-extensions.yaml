name: Publish bolt-proto-extensions image
on:
  release:
    types: [published]
permissions:
  contents: read
  packages: write
concurrency:
  group: bolt-proto-extensions-publish
  cancel-in-progress: false
jobs:
  publish:
    name: Build and push ghcr.io/phi-labs-ltd/bolt-proto-extensions
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the image tag from the release title and refuse to overwrite it
        id: tag
        shell: bash
        env:
          RELEASE_TITLE: ${{ github.event.release.name }}
        run: |
          if [[ ! "$RELEASE_TITLE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Release title '$RELEASE_TITLE' is not in the expected v<major>.<minor>.<patch>[-<pre>] format"
            exit 1
          fi
          repo="ghcr.io/phi-labs-ltd/bolt-proto-extensions"
          image="$repo:$RELEASE_TITLE"
          scripts/ghcr-tag-exists "$image" && status=0 || status=$?
          case $status in
            0) echo "::error::$image already exists"; exit 1 ;;
            1) ;;
            *) echo "::error::could not check whether $image exists"; exit 1 ;;
          esac
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "latest=$repo:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: plugins/bolt-proto-extensions
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}
            ${{ steps.tag.outputs.latest }}
