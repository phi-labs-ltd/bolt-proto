name: Rust CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  rust:
    name: Generate crates, lint and test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          version: 1.72.0
          token: ${{ secrets.BUF_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Check bolt-proto-extensions image tag matches its VERSION
        run: grep -q "bolt-proto-extensions:v$(cat plugins/bolt-proto-extensions/VERSION)}" scripts/bolt-proto-extensions

      - name: Build bolt-proto-extensions from this checkout
        run: docker build -t bolt-proto-extensions:ci plugins/bolt-proto-extensions

      - name: Generate the bolt-proto and cex-proto crates
        run: just rust
        env:
          BOLT_PROTO_EXTENSIONS_IMAGE: bolt-proto-extensions:ci

      - name: Clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        working-directory: rust
        run: cargo test --workspace --all-features
