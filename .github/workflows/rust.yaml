name: Rust CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  rust:
    name: Generate crates, lint and test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          version: 1.72.0
          token: ${{ secrets.BUF_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Check protoc-gen-bolt image tag matches its VERSION
        run: grep -q "protoc-gen-bolt:v$(cat plugins/protoc-gen-bolt/VERSION)}" scripts/protoc-gen-bolt

      - name: Build protoc-gen-bolt from this checkout
        run: docker build -t protoc-gen-bolt:ci plugins/protoc-gen-bolt

      - name: Generate the bolt-proto and cex-proto crates
        run: just rust
        env:
          PROTOC_GEN_BOLT_IMAGE: protoc-gen-bolt:ci

      - name: Clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        working-directory: rust
        run: cargo test --workspace --all-features
