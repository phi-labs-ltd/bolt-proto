name: Go CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - plugins/bolt-proto-extensions/**
      - .github/workflows/go.yaml
permissions:
  contents: read
jobs:
  go:
    name: Format, vet and tidy bolt-proto-extensions
    runs-on: self-hosted
    defaults:
      run:
        working-directory: plugins/bolt-proto-extensions
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: plugins/bolt-proto-extensions/go.mod
          cache-dependency-path: plugins/bolt-proto-extensions/go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go mod tidy
        run: go mod tidy -diff
