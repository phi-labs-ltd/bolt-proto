[package]
name        = "bolt-proto"
version     = "0.1.0"
edition     = "2021"
description = "Generated Rust types and gRPC clients/servers for the Bolt Protocol protobuf schemas."
repository  = "https://github.com/phi-labs-ltd/bolt-proto"
publish     = ["kellnr"]
include = ["src/**/*.rs", "examples/**/*.rs", "Cargo.toml"]

[dependencies]
bytes        = "1.12.1"
prost        = "0.14.4"
prost-types  = "0.14.4"
ruint        = { version = "1.21.1", optional = true }
num-traits   = { version = "0.2.19", optional = true }
rust_decimal = { version = "1.36.0", optional = true }
tonic        = { version = "0.14.8", optional = true }
tonic-prost  = { version = "0.14.8", optional = true }
tokio        = { version = "1.54.1", features = ["rt", "sync", "time", "macros"], optional = true }
tokio-stream = { version = "0.1.19", optional = true }

[features]
default = ["grpc"]
grpc    = ["dep:tonic", "dep:tonic-prost"]
# Async managers that drive a stream_cache from a live gRPC stream.
stream-manager = ["grpc", "dep:tokio", "dep:tokio-stream"]
# Numeric conversions: numeric v3's UInt256 <-> ruint's U256, and Bps <-> rust_decimal's Decimal plus num_traits impls.
num = ["dep:ruint", "dep:num-traits", "dep:rust_decimal"]

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "test-util"] }

[[example]]
name              = "subscribe_liquidity_updates"
required-features = ["stream-manager"]

[lints.clippy]
large_enum_variant = "allow"
