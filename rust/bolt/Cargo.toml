[package]
name        = "bolt-proto"
version     = "0.1.0"
edition     = "2021"
description = "Generated Rust types and gRPC clients/servers for the Bolt Protocol protobuf schemas."
repository  = "https://github.com/phi-labs-ltd/bolt-proto"
publish     = ["kellnr"]
include = ["src/**/*.rs", "Cargo.toml"]

[dependencies]
bytes       = "1.12"
prost       = "0.14.4"
prost-types = "0.14.4"
tonic       = "0.14.6"
tonic-prost = "0.14.6"
tokio       = { version = "1", features = ["rt", "sync", "time", "macros"], optional = true }
tokio-stream = { version = "0.1", optional = true }

[features]
default        = ["stream-manager"]
# Async managers that drive a stream_cache from a live gRPC stream.
stream-manager = ["dep:tokio", "dep:tokio-stream"]

[dev-dependencies]
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "test-util"] }

[lints.clippy]
large_enum_variant = "allow"
