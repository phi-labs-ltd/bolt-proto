[package]
name        = "cex-proto"
version     = "0.1.0"
edition     = "2021"
description = "Generated Rust types and gRPC clients/servers for the CEX protobuf schemas."
repository  = "https://github.com/phi-labs-ltd/bolt-proto"
publish     = ["kellnr"]
include = ["src/lib.rs", "src/cex.*.rs", "Cargo.toml"]

[dependencies]
bolt-proto  = { path = "../bolt", version = "0.1.0", registry = "kellnr" }
bytes       = "1.12"
prost       = "0.14.4"
prost-types = "0.14.4"
tonic       = "0.14.6"
tonic-prost = "0.14.6"
