[package]
name        = "bolt-proto"
version     = "0.1.0"
edition     = "2021"
description = "Generated Rust types and gRPC clients/servers for the Bolt Protocol protobuf schemas."
repository  = "https://github.com/phi-labs-ltd/bolt-proto"
publish     = ["kellnr"]
include = ["src/**/*.rs", "Cargo.toml"]

[dependencies]
bytes        = "1.12"
pbjson-types = "0.9"
prost        = "0.14.4"
tonic        = "0.14.6"
tonic-prost  = "0.14.6"
