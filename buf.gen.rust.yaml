version: v2

plugins:
  # bolt-proto: message types, one module per proto package.
  - remote: buf.build/community/neoeinstein-prost:v0.5.0
    out: ./rust/bolt/src
    include_imports: true
    exclude_types:
      - cex.**
    opt:
      - enable_type_names
      - bytes=.
      - file_descriptor_set
      - flat_output_dir
      # google.type.Decimal's grammar comment is indented, so rustdoc runs it as a doctest.
      - disable_comments=.google.type.Decimal

  # bolt-proto: gRPC clients and servers.
  - remote: buf.build/community/neoeinstein-tonic:v0.5.0
    out: ./rust/bolt/src
    types:
      - bolt.**
    opt:
      - no_server=false
      - no_client=false
      - flat_output_dir
      - client_mod_attribute=.=#[cfg(feature = "grpc")]
      - server_mod_attribute=.=#[cfg(feature = "grpc")]

  # bolt-proto: crate lib.rs, the module tree over every generated file.
  - remote: buf.build/community/neoeinstein-prost-crate:v0.5.0
    out: ./rust/bolt/src
    include_imports: true
    exclude_types:
      - cex.**
    opt:
      - no_features
      - include_file=generated.rs
      - flat_output_dir
      - only_include=.bolt
      - only_include=.google

  # cex-proto: message types. The shared bolt.* types come from bolt-proto.
  - remote: buf.build/community/neoeinstein-prost:v0.5.0
    out: ./rust/cex/src
    types:
      - cex.**
    opt:
      - enable_type_names
      - bytes=.
      - file_descriptor_set
      - extern_path=.bolt=::bolt_proto::bolt
      - flat_output_dir

  # cex-proto: gRPC clients and servers.
  - remote: buf.build/community/neoeinstein-tonic:v0.5.0
    out: ./rust/cex/src
    types:
      - cex.**
    opt:
      - no_server=false
      - no_client=false
      - extern_path=.bolt=::bolt_proto::bolt
      - flat_output_dir

  # cex-proto: crate lib.rs, the module tree over every generated file.
  - remote: buf.build/community/neoeinstein-prost-crate:v0.5.0
    out: ./rust/cex/src
    types:
      - cex.**
    opt:
      - no_features
      - include_file=lib.rs
      - flat_output_dir
      - only_include=.cex

inputs:
  - directory: .
