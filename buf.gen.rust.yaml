version: v2
clean: true

plugins:
  # bolt-proto: message types, one module per proto package.
  - remote: buf.build/community/neoeinstein-prost:v0.5.0
    out: ./rust/bolt/src
    types:
      - bolt.**
    opt:
      - enable_type_names
      - bytes=.
      - file_descriptor_set
      - flat_output_dir

  # bolt-proto: gRPC clients and servers.
  - remote: buf.build/community/neoeinstein-tonic:v0.5.0
    out: ./rust/bolt/src
    types:
      - bolt.**
    opt:
      - no_server=false
      - no_client=false
      - flat_output_dir

  # bolt-proto: crate lib.rs, the module tree over every generated file.
  - remote: buf.build/community/neoeinstein-prost-crate:v0.5.0
    out: ./rust/bolt/src
    types:
      - bolt.**
    opt:
      - no_features
      - include_file=lib.rs
      - flat_output_dir
      - only_include=.bolt

  # cex-proto: message types. The shared bolt.* types come from bolt-proto.
  - remote: buf.build/community/neoeinstein-prost:v0.5.0
    out: ./rust/cex/src
    types:
      - cex.**
    opt:
      - enable_type_names
      - bytes=.
      - file_descriptor_set
      - extern_path=.bolt=::bolt_proto::bolt
      - flat_output_dir

  # cex-proto: gRPC clients and servers.
  - remote: buf.build/community/neoeinstein-tonic:v0.5.0
    out: ./rust/cex/src
    types:
      - cex.**
    opt:
      - no_server=false
      - no_client=false
      - extern_path=.bolt=::bolt_proto::bolt
      - flat_output_dir

  # cex-proto: crate lib.rs, the module tree over every generated file.
  - remote: buf.build/community/neoeinstein-prost-crate:v0.5.0
    out: ./rust/cex/src
    types:
      - cex.**
    opt:
      - no_features
      - include_file=lib.rs
      - flat_output_dir
      - only_include=.cex

inputs:
  - directory: .
