syntax = "proto3";

package cex.public.v1;

import "bolt/assets/v1/assets.proto";
import "bolt/cex/types/v1/types.proto";
import "bolt/common/numeric/v2/numeric.proto";
import "google/protobuf/timestamp.proto";

// Unauthenticated CEX market data.
service PublicCexService {
  // Get an order book.
  rpc GetOrderBook(GetOrderBookRequest) returns (GetOrderBookResponse);
  // Get mid prices.
  rpc GetPrices(GetPricesRequest) returns (GetPricesResponse);
  // Validate pairs.
  rpc ValidateAssets(ValidateAssetsRequest) returns (ValidateAssetsResponse);
  // Stream best bid/ask updates.
  rpc SubscribeBookTicker(SubscribeBookTickerRequest) returns (stream SubscribeBookTickerResponse);
}

// PriceLevel: Order book level.
message PriceLevel {
  // price: Level price.
  bolt.common.numeric.v2.Fraction price = 1;
  // quantity: Level size.
  bolt.common.numeric.v2.Fraction quantity = 2;
}

// ExchangePairs: Pairs on one exchange.
message ExchangePairs {
  // exchange: Exchange. required
  bolt.cex.types.v1.Exchange exchange = 1;
  // pairs: Pairs. required
  repeated bolt.assets.v1.Pair pairs = 2;
}

// GetOrderBookRequest: Order book request.
message GetOrderBookRequest {
  // exchange: Exchange. required
  bolt.cex.types.v1.Exchange exchange = 1;
  // pair: Pair. required
  bolt.assets.v1.Pair pair = 2;
  // depth: Levels per side.
  optional uint32 depth = 3;
}

// OrderBook: Order book sides.
message OrderBook {
  // asks: Ascending by price.
  repeated PriceLevel asks = 1;
  // bids: Descending by price.
  repeated PriceLevel bids = 2;
}

// GetOrderBookResponse: Order book response.
message GetOrderBookResponse {
  // order_book: Order book.
  OrderBook order_book = 1;
}

// GetPricesRequest: Prices request.
message GetPricesRequest {
  // exchange: Exchange. required
  bolt.cex.types.v1.Exchange exchange = 1;
  // pairs: Pairs. required
  repeated bolt.assets.v1.Pair pairs = 2;
}

// GetPricesResponse: Prices response.
message GetPricesResponse {
  // prices: Prices in request order.
  repeated Price prices = 1;
}

// Price: Mid price of a pair.
message Price {
  // pair: Pair.
  bolt.assets.v1.Pair pair = 1;
  // price: Mid price.
  bolt.common.numeric.v2.Fraction price = 2;
}

// ValidateAssetsRequest: Validation request.
message ValidateAssetsRequest {
  // exchange: Exchange. required
  bolt.cex.types.v1.Exchange exchange = 1;
  // pairs: Pairs. required
  repeated bolt.assets.v1.Pair pairs = 2;
}

// ValidateAssetsResponse: Validation response.
message ValidateAssetsResponse {}

// SubscribeBookTickerRequest: Subscription request.
message SubscribeBookTickerRequest {
  // exchange_pairs: Pairs per exchange. required
  repeated ExchangePairs exchange_pairs = 1;
}

// SubscribeBookTickerResponse: Best bid/ask update.
message SubscribeBookTickerResponse {
  // exchange: Exchange.
  bolt.cex.types.v1.Exchange exchange = 1;
  // pair: Pair.
  bolt.assets.v1.Pair pair = 2;
  // order_book: Order book.
  OrderBook order_book = 3;
  // update_id: Exchange sequence number.
  optional uint64 update_id = 4;
  // updated_at: Exchange update time.
  optional google.protobuf.Timestamp updated_at = 5;
  // fetched_at: Server receive time.
  google.protobuf.Timestamp fetched_at = 6;
}
