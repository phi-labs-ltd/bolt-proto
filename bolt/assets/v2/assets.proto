syntax = "proto3";

package bolt.assets.v2;

import "bolt/common/numeric/v3/numeric.proto";

// Balance: Specific asset balance.
message Balance {
  reserved 2, 3;
  // asset: Asset name
  string asset = 1;
  // amount: Exact amount of the asset in tokens, not raw units. Never negative.
  // required
  bolt.common.numeric.v3.Fraction256 amount = 4;
}
