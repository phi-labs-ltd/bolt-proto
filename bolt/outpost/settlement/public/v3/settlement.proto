syntax = "proto3";

package bolt.outpost.settlement.public.v3;

import "bolt/assets/v2/assets.proto";
import "bolt/common/partners/v1/partners.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

// PublicSettlementService: Public read-only access to settlement pools, liquidity updates and balances.
service PublicSettlementService {
  // Endpoint to fetch pools by base asset.
  rpc GetPools(GetPoolsRequest) returns (GetPoolsResponse);
  // Endpoint to fetch liquidity updates by transaction hash or block heights.
  rpc GetLiquidityUpdates(GetLiquidityUpdatesRequest) returns (GetLiquidityUpdatesResponse);
  // Endpoint to subscribe to liquidity updates.
  rpc SubscribeLiquidityUpdates(SubscribeLiquidityUpdatesRequest) returns (stream SubscribeLiquidityUpdatesResponse);
  // Endpoint to fetch the assets held by a wallet address.
  rpc GetBalances(GetBalancesRequest) returns (GetBalancesResponse);
  // Endpoint to query the settlement info.
  rpc Info(InfoRequest) returns (InfoResponse);
}

// GetPoolsRequest: Request to fetch pools by base asset.
message GetPoolsRequest {
  // base_assets: Base assets of the pools to fetch (e.g. "SUI", "USDC"). If empty, all pools are returned.
  repeated string base_assets = 1;
}

// GetPoolsResponse: Response to the GetPoolsRequest.
message GetPoolsResponse {
  // pools: Description of the fetched pools.
  repeated Pool pools = 1;
}

// GetLiquidityUpdatesRequest: Request to fetch liquidity updates by transaction hash or block heights.
message GetLiquidityUpdatesRequest {
  // query: Selector for the liquidity updates to fetch.
  oneof query {
    // tx_hash: Hash/digest of the transaction to fetch liquidity updates for.
    string tx_hash = 1;
    // block_heights: Block heights to fetch liquidity updates for.
    BlockHeights block_heights = 2;
  }
  // field_mask: Liquidity update types to include: "deposit", "withdrawal", "trade", or "*" for all.
  google.protobuf.FieldMask field_mask = 3;
}

// GetLiquidityUpdatesResponse: Response to the GetLiquidityUpdatesRequest.
message GetLiquidityUpdatesResponse {
  // updates: Liquidity updates matching the query.
  repeated LiquidityUpdate updates = 1;
}

// SubscribeLiquidityUpdatesRequest: Request starting liquidity updates subscription.
message SubscribeLiquidityUpdatesRequest {
  // field_mask: Liquidity update types to include: "deposit", "withdrawal", "trade", or "*" for all.
  google.protobuf.FieldMask field_mask = 1;
}

// SubscribeLiquidityUpdatesResponse: Streamed response for SubscribeLiquidityUpdatesRequest.
// The service sends at least one response every 10 seconds, also when no update matches the field_mask.
// The first response comes at once after the subscribe.
message SubscribeLiquidityUpdatesResponse {
  // updates: Liquidity updates of this response. They happened at block_height. The list can be empty.
  repeated LiquidityUpdate updates = 1;
  // block_height: Block height of the updates. Several responses can have the same block height.
  // In a response without updates, it is the latest block height that the service knows.
  // It does not mean that all updates at or below it were sent.
  // It can decrease. A response with a removed update carries the height of the reverted block.
  uint64 block_height = 2;
}

// GetBalancesRequest: Request fetching the assets held by a wallet address.
message GetBalancesRequest {
  // address: Wallet address to fetch the balances for.
  string address = 1;
  // assets: Assets to fetch the balances for (e.g. "SUI", "USDC"). If empty, all assets are returned.
  repeated string assets = 2;
}

// GetBalancesResponse: Response for GetBalancesRequest.
message GetBalancesResponse {
  // balances: Balances held by the address.
  repeated bolt.assets.v2.Balance balances = 1;
}

// InfoRequest: Queries for settlement info.
message InfoRequest {}

// InfoResponse: Response for InfoRequest.
message InfoResponse {
  // network_id: Network identifier where the settlement sync is deployed.
  string network_id = 1;
  // latest_block_height: The latest block height of the chain, as seen by the service when it answers.
  // It is not final. A block at or below it can still be reverted, and the value can decrease after a reorg.
  // It can differ from block_height in a stream response.
  // It is not a bound of completeness. A request for a block at or below it can still fail or return no updates.
  uint64 latest_block_height = 2;
}

// BlockHeights: List of block heights.
message BlockHeights {
  // block_height: Block heights.
  repeated uint64 block_height = 1;
}

// Pool: Description of a single liquidity pool.
message Pool {
  // base_liquidity: Base reserve of the pool.
  bolt.assets.v2.Balance base_liquidity = 1;
  // quote_liquidity: Quote token reserves of the pool.
  repeated bolt.assets.v2.Balance quote_liquidity = 2;
  // base_deposited: Sum of base deposits since the last base withdrawal.
  bolt.assets.v2.Balance base_deposited = 3;
  // address: Address of the pool contract (e.g. "0x1234567890AbcdEF1234567890aBcdef12345678").
  string address = 4;
  // block_height: The pool's values are its state at this block.
  uint64 block_height = 5;
}

// Trade: A swap in which a trader paid quote tokens and received base tokens.
message Trade {
  // tx_hash: Hash/digest of the transaction.
  string tx_hash = 1;
  // tx_id: Unique identifier of this event, as a single transaction may emit multiple events.
  string tx_id = 2;
  // trader: Address that paid the quote tokens and received the base tokens.
  string trader = 3;
  // block_height: Block height at which the trade happened.
  uint64 block_height = 4;
  // quote_in: Quote tokens paid by the trader.
  bolt.assets.v2.Balance quote_in = 5;
  // base_out: Base tokens received by the trader, after fees.
  bolt.assets.v2.Balance base_out = 6;
  reserved 7;
  // price: Oracle price used for the trade, quote per base, as an exact fraction string, "n/d" or "n" for a whole number (e.g. "5/3").
  string price = 15;
  // base_liquidity: Base reserve of the pool after the trade.
  bolt.assets.v2.Balance base_liquidity = 8;
  // quote_liquidity: Reserve of the paid quote token after the trade, including quote_in.
  bolt.assets.v2.Balance quote_liquidity = 9;
  reserved 10;
  // protocol_fee: Protocol fee amount of the trade, in base asset units, as an exact fraction string, "n/d" or "n" for a whole number (e.g. "5/3").
  string protocol_fee = 16;
  reserved 11;
  // lp_fee: Liquidity provider fee amount of the trade, in base asset units, as an exact fraction string, "n/d" or "n" for a whole number (e.g. "5/3").
  string lp_fee = 17;
  reserved 12;
  // dynamic_fee: Dynamic fee amount of the trade, in base asset units, as an exact fraction string, "n/d" or "n" for a whole number (e.g. "5/3").
  string dynamic_fee = 18;
  // swap_timestamp: Timestamp of the trade.
  google.protobuf.Timestamp swap_timestamp = 13;
  // originator: The partner that originated the trade.
  bolt.common.partners.v1.Partner originator = 14;
}

// Deposit: A deposit of base tokens into the pool by a liquidity provider.
message Deposit {
  // tx_hash: Hash/digest of the transaction.
  string tx_hash = 1;
  // tx_id: Unique identifier of this event, as a single transaction may emit multiple events.
  string tx_id = 2;
  // trader: Address of the liquidity provider that deposited.
  string trader = 3;
  // block_height: Block height at which the deposit happened.
  uint64 block_height = 4;
  // deposit_amount: Base tokens deposited.
  bolt.assets.v2.Balance deposit_amount = 5;
  // base_liquidity: Base reserve of the pool after the deposit.
  bolt.assets.v2.Balance base_liquidity = 6;
  // base_deposited: Sum of base deposits since the last base withdrawal, including this one.
  bolt.assets.v2.Balance base_deposited = 7;
  // deposit_timestamp: Timestamp of the deposit.
  google.protobuf.Timestamp deposit_timestamp = 8;
}

// Withdrawal: A withdrawal of pool reserves by a liquidity provider.
message Withdrawal {
  // tx_hash: Hash/digest of the transaction.
  string tx_hash = 1;
  // tx_id: Unique identifier of this event, as a single transaction may emit multiple events.
  string tx_id = 2;
  // trader: Address of the liquidity provider that withdrew.
  string trader = 3;
  // block_height: Block height at which the withdrawal happened.
  uint64 block_height = 4;
  // base_withdrawn: Base tokens withdrawn.
  bolt.assets.v2.Balance base_withdrawn = 5;
  // quotes_withdrawn: Quote tokens withdrawn.
  repeated bolt.assets.v2.Balance quotes_withdrawn = 6;
  // withdrawal_timestamp: Timestamp of the withdrawal.
  google.protobuf.Timestamp withdrawal_timestamp = 8;
}

// LiquidityUpdate: A single change to pool liquidity.
message LiquidityUpdate {
  // update: The kind of liquidity update.
  oneof update {
    // deposit: Base tokens deposited into the pool.
    Deposit deposit = 1;
    // withdrawal: Reserves withdrawn from the pool.
    Withdrawal withdrawal = 2;
    // trade: Swap executed against the pool.
    Trade trade = 3;
    // removed: tx_id of the deposit, withdrawal or trade that was reverted.
    string removed = 4;
  }
}
