syntax = "proto3";

package bolt.cex.public_cex.v1;

import "bolt/assets/v1/assets.proto";
import "bolt/cex/public_cex/v1/types.proto";
import "bolt/cex/types/v1/types.proto";
import "bolt/common/numeric/v2/numeric.proto";
import "google/protobuf/timestamp.proto";

// Unauthenticated CEX market data. Every request names the exchange, so a caller
// can switch exchanges at runtime by changing one field. Instruments are always
// addressed as a Pair; the server resolves the exchange's native instrument name.
service PublicCexService {
  // Endpoint to get the order book for a pair.
  rpc GetOrderBook(GetOrderBookRequest) returns (GetOrderBookResponse);
  // Endpoint to get the top of book with resting sizes for a pair.
  rpc GetPriceDetailed(GetPriceDetailedRequest) returns (GetPriceDetailedResponse);
  // Endpoint to get the mid price for a pair.
  rpc GetPrice(GetPriceRequest) returns (GetPriceResponse);
  // Endpoint to get mid prices for several pairs in one call.
  rpc GetPrices(GetPricesRequest) returns (GetPricesResponse);
  // Endpoint to list tradable instruments and their order constraints.
  rpc GetInstruments(GetInstrumentsRequest) returns (GetInstrumentsResponse);
  // Endpoint to stream best bid/ask updates.
  rpc SubscribeBookTicker(SubscribeBookTickerRequest) returns (stream SubscribeBookTickerResponse);
}

// PriceLevel: One resting order book level.
message PriceLevel {
  // price: Price of the level in quote asset units, as a rational (e.g. 5/4 for 1.25).
  bolt.common.numeric.v2.Fraction price = 1;
  // quantity: Size resting at this price, in base asset units.
  bolt.common.numeric.v2.Fraction quantity = 2;
}

// GetOrderBookRequest: Request for a pair's order book.
message GetOrderBookRequest {
  // exchange: The exchange to query. required
  bolt.cex.types.v1.Exchange exchange = 1;
  // pair: The pair to query. required
  bolt.assets.v1.Pair pair = 2;
  // depth: Levels to return per side. Defaults to 50 when unset.
  optional uint32 depth = 3;
}

// GetOrderBookResponse: Response to GetOrderBookRequest.
message GetOrderBookResponse {
  // asks: Sell levels, ascending by price.
  repeated PriceLevel asks = 1;
  // bids: Buy levels, descending by price.
  repeated PriceLevel bids = 2;
}

// GetPriceDetailedRequest: Request for a pair's top of book.
message GetPriceDetailedRequest {
  // exchange: The exchange to query. required
  bolt.cex.types.v1.Exchange exchange = 1;
  // pair: The pair to query. required
  bolt.assets.v1.Pair pair = 2;
}

// GetPriceDetailedResponse: Response to GetPriceDetailedRequest.
message GetPriceDetailedResponse {
  // bid: Best bid price in quote asset units.
  bolt.common.numeric.v2.Fraction bid = 1;
  // bid_size: Size resting at the best bid, in base asset units.
  bolt.common.numeric.v2.Fraction bid_size = 2;
  // ask: Best ask price in quote asset units.
  bolt.common.numeric.v2.Fraction ask = 3;
  // ask_size: Size resting at the best ask, in base asset units.
  bolt.common.numeric.v2.Fraction ask_size = 4;
}

// GetPriceRequest: Request for a pair's mid price.
message GetPriceRequest {
  // exchange: The exchange to query. required
  bolt.cex.types.v1.Exchange exchange = 1;
  // pair: The pair to query. required
  bolt.assets.v1.Pair pair = 2;
}

// GetPriceResponse: Response to GetPriceRequest.
message GetPriceResponse {
  // price: Mid price, computed as (bid + ask) / 2. This is not the last traded price.
  bolt.common.numeric.v2.Fraction price = 1;
}

// GetPricesRequest: Request for mid prices across several pairs.
message GetPricesRequest {
  // exchange: The exchange to query. required
  bolt.cex.types.v1.Exchange exchange = 1;
  // pairs: The pairs to price. required, must be non-empty
  repeated bolt.assets.v1.Pair pairs = 2;
}

// GetPricesResponse: Response to GetPricesRequest.
message GetPricesResponse {
  // results: One entry per requested pair, in request order.
  repeated PriceResult results = 1;
}

// PriceResult: Mid price for one pair, or why it could not be priced.
message PriceResult {
  // pair: The pair this result is for.
  bolt.assets.v1.Pair pair = 1;
  // result: The price, or the failure reason for this pair alone.
  oneof result {
    // price: Mid price, computed as (bid + ask) / 2.
    bolt.common.numeric.v2.Fraction price = 2;
    // error: Why this pair failed. Other pairs in the batch are unaffected.
    PriceError error = 3;
  }
}

// PriceError: Machine-readable reason a pair could not be priced, with an optional human-readable detail.
message PriceError {
  // reason: Machine-readable failure reason.
  PriceErrorReason reason = 1;
  // detail: Human-readable detail for logs and debugging; not for programmatic matching.
  optional string detail = 2;
}

// GetInstrumentsRequest: Request for an exchange's tradable instruments.
message GetInstrumentsRequest {
  // exchange: The exchange to query. required
  bolt.cex.types.v1.Exchange exchange = 1;
}

// GetInstrumentsResponse: Response to GetInstrumentsRequest.
message GetInstrumentsResponse {
  // instruments: Instruments currently tradable on the exchange.
  repeated Instrument instruments = 1;
}

// Instrument: A tradable pair and the constraints an order on it must satisfy.
message Instrument {
  // pair: The pair in Bolt terms. Use this to address the instrument on every other RPC.
  bolt.assets.v1.Pair pair = 1;
  // native_name: The exchange's own name for the instrument (e.g. "ATOM_USDT").
  // Informational only; it is not accepted as input anywhere.
  string native_name = 2;
  // price_tick_size: Smallest price increment the exchange accepts (e.g. 1/1000000).
  bolt.common.numeric.v2.Fraction price_tick_size = 3;
  // price_decimals: Decimal places the exchange accepts on price.
  uint32 price_decimals = 4;
  // quantity_tick_size: Smallest quantity increment the exchange accepts.
  bolt.common.numeric.v2.Fraction quantity_tick_size = 5;
  // quantity_decimals: Decimal places the exchange accepts on quantity.
  uint32 quantity_decimals = 6;
  // min_base_quantity: Smallest order size in base asset units. Unset when the exchange publishes none.
  optional bolt.common.numeric.v2.Fraction min_base_quantity = 7;
  // min_quote_amount: Smallest order notional in quote asset units. Unset when the exchange publishes none.
  optional bolt.common.numeric.v2.Fraction min_quote_amount = 8;
}

// SubscribeBookTickerRequest: Request to stream best bid/ask updates.
message SubscribeBookTickerRequest {
  // exchange: The exchange to stream from. required
  bolt.cex.types.v1.Exchange exchange = 1;
  // pairs: The pairs to stream. required, must be non-empty
  repeated bolt.assets.v1.Pair pairs = 2;
}

// SubscribeBookTickerResponse: A single best bid/ask update for one instrument.
message SubscribeBookTickerResponse {
  // pair: The pair this update is for.
  bolt.assets.v1.Pair pair = 1;
  // best_bid_price: Best bid price in quote asset units.
  bolt.common.numeric.v2.Fraction best_bid_price = 2;
  // best_bid_quantity: Size resting at the best bid, in base asset units.
  bolt.common.numeric.v2.Fraction best_bid_quantity = 3;
  // best_ask_price: Best ask price in quote asset units.
  bolt.common.numeric.v2.Fraction best_ask_price = 4;
  // best_ask_quantity: Size resting at the best ask, in base asset units.
  bolt.common.numeric.v2.Fraction best_ask_quantity = 5;
  // update_id: Exchange sequence number for the update. Unset when the exchange
  // sends none, so gaps are only detectable when this is set.
  optional uint64 update_id = 6;
  // updated_at: When the exchange reported generating the update. Unset when the exchange sends none.
  optional google.protobuf.Timestamp updated_at = 7;
  // fetched_at: When the server received and parsed the update.
  google.protobuf.Timestamp fetched_at = 8;
  // native_name: The exchange's own name for the instrument (e.g. "ATOM_USDT"),
  // matching Instrument.native_name. Carried so consumers keyed by native name
  // can route the update without a pair lookup.
  string native_name = 9;
}
