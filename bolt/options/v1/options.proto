syntax = "proto3";

package bolt.options.v1;

import "google/protobuf/descriptor.proto";

// PairSpec: Field paths of the two halves of a pair carried by a message.
message PairSpec {
  // base: Dotted path to the base field, e.g. "instrument.base". required
  string base = 1;
  // quote: Dotted path to the quote field, e.g. "instrument.quote". required
  string quote = 2;
}

// Extension numbers 51000-51099 are reserved for bolt options.
extend google.protobuf.MessageOptions {
  // pair: Base and quote of the message; bolt-proto-extensions generates `fn pair()`
  // on the Rust type, returning (base, quote).
  PairSpec pair = 51000;
}

extend google.protobuf.FieldOptions {
  // validate: Rust boolean expression that must hold for the field, e.g.
  // "!base.is_empty()"; bolt-proto-extensions generates `fn validate()` on the
  // Rust type, which checks every rule in field order and returns the first
  // failure as Err. The field is bound under its Rust name (e.g. `r#type`): by
  // value for non-optional numeric, bool and enum fields, by reference otherwise.
  // Repeat the option for several rules on one field.
  repeated string validate = 51001;
}
